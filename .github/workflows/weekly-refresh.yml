name: Haftalik oyun bilgisi yenileme

# Her pazartesi: puan, indirme, surum, yas siniri ve "Yenilikler" metni guncellenir,
# Play Store'dan kaldirilan oyunlar isaretlenir, APK linkleri kontrol edilir, siralama yenilenir.
# (Gunluk update-apks.yml sadece APK linklerini ve eksik alanlari kontrol eder.)
on:
  schedule:
    - cron: "0 3 * * 1" # pazartesi 03:00 UTC (TR 06:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: games-json
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests google-play-scraper pillow

      - run: python update_apks.py

      - run: python enrich_details.py --refresh

      - run: python reorder_games.py

      - name: Degisiklik varsa commit + push
        id: commit
        run: |
          if git diff --quiet games.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json
          git commit -m "Haftalik oyun bilgisi yenileme"
          git push
          # Uygulama @main adresini okuyor; main'i master ile ayni tut.
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: jsDelivr onbellegini temizle
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/nukIeer/gameshieldcdn@master/games.json"
          curl -fsS "https://purge.jsdelivr.net/gh/nukIeer/gameshieldcdn@main/games.json"
